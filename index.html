<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>BRT Enterprise Advisor</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <img
        src="img/BRT_logo_white_rgb.png"
        alt="Logo BRT"
        class="logo">

    <div class="header-text">
        <h1>BRT Enterprise Advisor</h1>
        <p>Configuratore Soluzioni Digitali BRT</p>
    </div>

</header>

<div class="container">

    <div class="card">

        <div id="step"></div>

        <div class="progress">
            <div id="bar" class="bar"></div>
        </div>

        <h2 id="q"></h2>

        <div id="answers" class="answers"></div>

        <div id="res" class="hidden"></div>

    </div>

</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>

<footer class="footer">

    <div class="footer-content">

        BRT Enterprise Advisor v1.0

        <span class="footer-divider">|</span>

        Creato da <strong>Gianluca Nanna</strong>

    </div>

</footer>

</body>

</html>
