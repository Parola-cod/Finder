<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#d40511">

<title>BRT Enterprise Advisor</title>

<style>

body{
    margin:0;
    font-family:'Segoe UI',Arial,sans-serif;
    background:#eef2f6;
}

header{
    background:#d40511;
    color:#fff;
    padding:30px 20px;
    position:relative;
    text-align:center;
}

.logo{
    position:absolute;
    left:30px;
    top:50%;
    transform:translateY(-50%);
    max-width:220px;
    height:auto;
}

.header-text h1{
    margin:0;
    font-size:clamp(28px,4vw,42px);
}

.header-text p{
    margin-top:10px;
    font-size:18px;
}

.container{
    width:95%;
    max-width:1200px;
    margin:auto;
    padding:30px 20px;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:30px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.progress{
    height:10px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.bar{
    height:100%;
    width:0%;
    background:#d40511;
    transition:.3s;
}

#step{
    margin-bottom:10px;
    font-weight:600;
}

.answers{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    margin-top:30px;
}

.option-btn{
    border:2px solid #d40511;
    background:#fff;
    color:#333;
    padding:18px;
    border-radius:12px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

.option-btn:hover{
    background:#d40511;
    color:#fff;
    transform:translateY(-2px);
}

.prod{
    background:#fafafa;
    border-left:5px solid #d40511;
    border-radius:8px;
    padding:15px;
    margin-bottom:15px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.hidden{
    display:none;
}

.btn{
    background:#d40511;
    color:#fff;
    border:none;
    padding:14px 30px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
}

.btn:hover{
    background:#b80000;
}

ul{
    padding-left:20px;
}

@media(max-width:900px){

    .grid{
        grid-template-columns:1fr;
    }

    .logo{
        position:static;
        transform:none;
        display:block;
        margin:0 auto 20px;
    }

    header{
        text-align:center;
    }
}

</style>

</head>

<body>

<header>

    <img
        src="BRT_logo_white_rgb.png"
        alt="Logo BRT"
        class="logo">

    <div class="header-text">
        <h1>BRT Enterprise Advisor</h1>
        <p>Configuratore Soluzioni Digitali BRT</p>
    </div>

</header>

<div class="container">

    <div class="card">

        <div id="step"></div>

        <div class="progress">
            <div id="bar" class="bar"></div>
        </div>

        <h2 id="q"></h2>

        <div id="answers" class="answers"></div>

        <div id="res" class="hidden"></div>

    </div>

</div>

<script>

const products = {

    "API REST BRT": {
        desc: "Integrazione completa per aggregatori e sistemi proprietari.",
        features: [
            "Creazione spedizioni",
            "Stampa etichette",
            "Tracking",
            "Fermopoint",
            "PUDO",
            "Pickup",
            "Notifiche",
            "Resi tramite integrazione API"
        ]
    },

    "EasySpedWeb": {
        desc: "Piattaforma ecommerce BRT.",
        features: [
            "WooCommerce",
            "Shopify",
            "Magento",
            "Prestashop",
            "Ebay",
            "Collection",
            "Fresh",
            "Fermopoint",
            "Direct2Shop",
            "Tracking"
        ]
    },

    "Plug&Ship": {
        desc: "Soluzione per CMS non supportati.",
        features: [
            "Inserimento manuale",
            "Upload file",
            "Etichette",
            "Tracking",
            "Drop Shipping",
            "Report spedizioni"
        ]
    },

    "Return My Parcel": {
        desc: "Gestione completa dei resi.",
        features: [
            "Portale resi",
            "Etichette reso",
            "Tracking resi",
            "Dashboard",
            "Locker",
            "PUDO"
        ]
    }
};

const questions = [

{
    key:"agg",
    title:"Quale aggregatore utilizza il cliente?",
    options:[
        "Nessuno",
        "ShippyPro",
        "Qapla",
        "Sendcloud",
        "SpedizioniOnline",
        "iSendu",
        "Smarty",
        "Poleepo",
        "Gestionale Proprietario"
    ]
},

{
    key:"cms",
    title:"Quale CMS utilizza?",
    options:[
        "WooCommerce",
        "Shopify",
        "Magento",
        "Prestashop",
        "Ebay",
        "CMS Proprietario",
        "Altro CMS"
    ]
},

{
    key:"collection",
    title:"Utilizza Collection?",
    options:["SI","NO"]
},

{
    key:"fresh",
    title:"Utilizza Fresh?",
    options:["SI","NO"]
},

{
    key:"resi",
    title:"Necessita gestione resi?",
    options:["SI","NO"]
}

];

let current = 0;
let answers = {};

function loadQuestion(){

    step.innerText =
        `Domanda ${current + 1} di ${questions.length}`;

    bar.style.width =
        ((current / questions.length) * 100) + "%";

    q.innerText =
        questions[current].title;

    document.getElementById("answers").innerHTML =
        questions[current].options.map(opt =>

            `<button
                class="option-btn"
                onclick="choose('${opt}')">
                ${opt}
            </button>`

        ).join("");

}

function choose(value){

    answers[questions[current].key] = value;

    if(current === 0 && value !== "Nessuno"){

        answers.cms = "N/A";
        answers.collection = "NO";
        answers.fresh = "NO";

        current = 4;
        loadQuestion();
        return;
    }

    if(
        current === 1 &&
        (value === "CMS Proprietario" ||
         value === "Altro CMS")
    ){

        answers.collection = "NO";
        answers.fresh = "NO";

        current = 4;
        loadQuestion();
        return;
    }

    if(current === questions.length - 1){

        calculate();
        return;
    }

    current++;

    loadQuestion();
}

function createList(items){

    return "<ul>" +
        items.map(x => `<li>${x}</li>`).join("")
        + "</ul>";
}

function calculate(){

    let solution = "";
    let reason = "";

    if(
        answers.agg &&
        answers.agg !== "Nessuno"
    ){

        solution = "API REST BRT";
        reason =
            "Cliente dotato di aggregatore o gestionale.";

    }

    else if(
        answers.cms === "CMS Proprietario"
    ){

        solution = "API REST BRT";
        reason = "CMS Proprietario.";

    }

    else if(
        [
            "WooCommerce",
            "Shopify",
            "Magento",
            "Prestashop",
            "Ebay"
        ].includes(answers.cms)
    ){

        solution = "EasySpedWeb";

        if(
            answers.collection === "SI" ||
            answers.fresh === "SI"
        ){
            reason =
                "Utilizzo Collection/Fresh.";
        }
        else{
            reason =
                "CMS supportato.";
        }
    }

    else{

        solution = "Plug&Ship";
        reason = "CMS non supportato.";
    }

    let html = `
        <h2>✅ ${solution}</h2>
        <p>${reason}</p>

        <div class="grid">

            <div>

                <div class="prod">

                    <h3>${solution}</h3>

                    <p>
                        ${products[solution].desc}
                    </p>

                    ${createList(
                        products[solution].features
                    )}

                </div>
    `;

    if(
        answers.resi === "SI" &&
        solution !== "API REST BRT"
    ){

        html += `
            <div class="prod">

                <h3>
                    Return My Parcel
                </h3>

                <p>
                    ${products["Return My Parcel"].desc}
                </p>

                ${createList(
                    products["Return My Parcel"].features
                )}

            </div>
        `;
    }

    html += `

            </div>

            <div>

                <h3>Scheda Cliente</h3>

                <ul>
                    <li>Aggregatore: ${answers.agg || "-"}</li>
                    <li>CMS: ${answers.cms || "-"}</li>
                    <li>Collection: ${answers.collection || "NO"}</li>
                    <li>Fresh: ${answers.fresh || "NO"}</li>
                    <li>Resi: ${answers.resi || "NO"}</li>
                </ul>

            </div>

        </div>

        <button
            class="btn"
            onclick="location.reload()">
            Nuova Analisi
        </button>
    `;

    document.getElementById("answers").style.display =
        "none";

    q.innerText = "Analisi completata";

    bar.style.width = "100%";

    res.innerHTML = html;
    res.classList.remove("hidden");
}

loadQuestion();

</script>

</body>
</html>
